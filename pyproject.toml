[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgewright"
version = "0.0.0"
description = "AI-assisted branching narrative content pipeline (Stage 0 skeleton)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "networkx>=3",
    "google-genai>=1.73",
    "openai>=2",
    "datamodel-code-generator>=0.56",
    "python-dotenv>=1.0",
    "Pillow>=10",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "zh-dict-mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.24",
]

[tool.setuptools]
packages = [
    "schema",
    "engine",
    "state",
    "validator",
    "content",
    "generator",
    "generator.prompts",
    "generator.prompts.scene",
    "generator.prompts.visual",
    "generator.providers",
    "generator.models",
    "generator.models._generated",
    "tools",
    "tools.review_ui",
    "generator.playtest",
    "generator.forward_planner",
    "generator.prompts.node",
    "generator.node_text_gen",
]

[tool.setuptools.package-data]
"generator.prompts.visual" = ["*.md"]
"generator.prompts.scene" = ["*.md"]
"generator.prompts.node" = ["*.md"]
"generator.playtest" = ["personas/*.json"]
"tools.review_ui" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*.js"]
