[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgewright"
version = "0.0.0"
description = "AI-assisted branching narrative content pipeline (Stage 0 skeleton)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "networkx>=3",
    "google-genai>=1.73",
    "datamodel-code-generator>=0.56",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = [
    "schema",
    "engine",
    "state",
    "validator",
    "content",
    "generator",
    "generator.prompts",
    "generator.prompts.visual",
    "generator.providers",
    "generator.models",
    "generator.models._generated",
]

[tool.setuptools.package-data]
"generator.prompts.visual" = ["*.md"]
