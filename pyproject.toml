[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgewright"
version = "0.0.0"
description = "AI-assisted branching narrative content pipeline (Stage 0 skeleton)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "networkx>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["schema", "engine", "state", "validator", "content"]
